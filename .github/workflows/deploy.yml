name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz
          chmod +x kubeconform

      - name: Validate K8s manifests
        run: |
          if [ -d k8s ]; then
            ./kubeconform -strict -summary k8s/
          elif [ -f secure-secret.yaml ]; then
            ./kubeconform -strict -summary secure-secret.yaml
          else
            echo "No K8s manifests found in k8s/ or repo root"
            exit 1
          fi
